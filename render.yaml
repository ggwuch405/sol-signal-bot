
services:
  - type: worker
    name: sol-signal-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python signal_bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: BYBIT_TESTNET
        value: "true"
